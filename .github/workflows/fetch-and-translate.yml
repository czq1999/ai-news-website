name: Fetch, Build, and Deploy AI News

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run update script
        if: github.event_name != 'push'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
        run: npm run update

      - name: Commit refreshed content if changed
        if: github.event_name != 'push'
        run: |
          git config user.name "AI News Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/articles.json public/data/articles-feed.json data/blogs.json public/data/blogs.json data/trending.json
          if git diff --staged --quiet; then
            echo "No content changes to commit"
          else
            git commit -m "chore: update articles [skip ci]"
            git push
          fi

      - name: Ensure blogs data is available for build
        run: |
          mkdir -p public/data
          if [ -f data/blogs.json ]; then
            cp data/blogs.json public/data/blogs.json
          fi

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
